name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flet
      - name: Build APK
        shell: bash {0}
        run: yes | flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
